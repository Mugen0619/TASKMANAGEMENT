services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: -Xmx384m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      # backendとの通信用(明示していないサービスが自動参加する既定のネットワーク)
      - default
      # INQUIRY-MANAGEMENT(別リポジトリ・別docker-composeスタック)との通信用。
      # EC2上で事前に`docker network create shared_net`しておく必要がある
      - shared_net

networks:
  default: {}
  shared_net:
    external: true
