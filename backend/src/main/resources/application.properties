spring.application.name=taskmanagement

# データベース: PostgreSQL（ローカルに taskmanagement という名前のDBを作成しておくこと）
# 接続情報は環境ごとに違ってよいので、環境変数があればそちらを優先し、なければ下記の初期値を使う
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
