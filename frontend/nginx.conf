server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # バックエンドAPIへのリバースプロキシ（同一オリジンにするのでCORS設定が不要になる）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # INQUIRY-MANAGEMENT(別リポジトリ、別docker-composeスタック)へのリバースプロキシ。
    # 別スタックのコンテナ名は起動タイミングによって名前解決できないことがあるため、
    # backend宛てのような静的proxy_passではなく、変数+resolverでリクエスト時に解決する。
    # こうすることで、inquiry-appコンテナが未起動でもnginx自体は起動でき、
    # TASKMANAGEMENT本体の動作(/ , /api/)には影響しない。
    location = /inquiries {
        return 301 /inquiries/;
    }

    location /inquiries/ {
        resolver 127.0.0.11 valid=10s;
        set $inquiry_app_upstream inquiry-app:3000;
        proxy_pass http://$inquiry_app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA(React Router等を使う場合)のため、存在しないパスはindex.htmlにフォールバック
    location / {
        try_files $uri /index.html;
    }
}
